
; =========================================================
; Fusion Fix RDR2 by Nochala
; =========================================================
; Boolean options use true / false.

[General]
Enabled=true

; (Default=false)
Logging=true

; Logs everything when true. (Default=false)
DebugLogging=true 



[Startup]
; Skips the Rockstar RDR2 Intro splash. (Default = false)
SkipIntroSplashes=true

; [YMT] Skips Rockstar Legal splashes. (Default = false)
SkipLegal=true

; [YMT] Automatically loads into Story Mode, bypassing the main menu. (Default = false)
StraightToStoryMode=true



[Engine] 
; [Memory] Fixes crashes related to YTD texture files. (Default = true)
YTDCrashFix=true

; [Memory] Expands streaming and engine pool limits. 
; Improves performance & helps prevent crashes caused by pool exhaustion. (Default = true)
ExtendStreamingPools=true

; [Memory] Expands engine asset pool limits.
; Improves stability & prevents texture pop-in. (Default = true)
ExtendAssetPools=true

; [Memory] Optimizes streaming memory allocation through gameconfig adjustments.
; This mainly reduces memory overhead and improves streaming performance. (Default = true)
OptimizeStreamingMemory=true

; [Memory] Greatly reduces stuttering caused by texture streaming and asset loading. (Default = true)
TextureStreamingStutterFix=true



[Gameplay]
; Prevents weapons from being automatically equipped when dismounting during missions. (Default = true)
NoAutoHorseEquip=true

; Prevents weapons from being automatically holstered while riding a horse. (Default = true)
NoAutoHorseHolster=true

; Prevents ammunition from being automatically collected. 
; This feature gives buying ammo a purpose. (Default = false)
NoAutoAmmoPickup=false

DisableHonorSystem=false
DisableHonorLossWhenMasked=false
DisableBountyWhenMasked=false
DisableInvisibleSnipers=false
DisableCampMovementRestrictions=false
AllowGunsInCamp=false
AllowHorsesInCamp=false
InstantInteractionPrompts=false
DisableFirstPersonAutoRun=false



[Weapons]
; [Memory] Prevents weapons from automatically reloading. (Default = false)
DisableAutoReload=false

DisableDeadEyeAutoReload=false
DisableArrowTrails=false
DisableReticleSpread=false  
DisableForcedScope=false
DisableWeaponDegradation=false
DisableOffHandHolster=false
DisableHitmarkers=false



[Visual]
; [Memory] Removes cinematic black bars during cutscenes. (Default = true)
RemoveBlackBars=true

; Disables the automatic idle camera. (Default = false)
DisableIdleCamera=true

;  Reduces camera shake during gameplay. (Default = false)
ReduceCameraShake=false

;  Reduces camera sway during gameplay. (Default = false)
ReduceCameraSway=false

; Disables camera head bobbing during movement. (Default = false)
DisableHeadBob=false



;      -----------------------------------------------
;      ==================== WORLD ====================
;      -----------------------------------------------
; [Memory]
FixShadowFlickering=false

; [Memory]
ExtendShadowDistance=false

; Disables interior lighting effects in buildings and enclosed spaces. (Default = false)
DisableInteriorLighting=false

; Disables distant light sources. May cause visual issues... (Default = false)
DisableDistantLights=false



;      -----------------------------------------------
;      =================== FILTERS ===================
;      -----------------------------------------------
; Disables visual distortion effects when intoxicated. (Default = false)
DisableDrunkFilter=false

; Removes the visual filter applied during Eagle Eye. (Default = false)
DisableEagleEyeFilter=false

; Removes the visual filter applied during Dead Eye. (Default = false)
DisableDeadEyeFilter=false

; Removes the filter applied when the pause menu is open. (Default = false)
DisablePauseMenuFilter=false

; Removes the filter applied when using the weapon wheel. (Default = false)
DisableWeaponWheelFilter=false

; Removes the effects applied when health is critically low. (Default = false)
DisableLowHealthFilter=false


;      -----------------------------------------------
;          =============== W I P ================
;      -----------------------------------------------

; [Memory] Removes screen vignette effects and edge darkening. (Default = false)
; DisableVignette=false    ; Causes visual issues, excluded for now.

; [Memory] Disables the bloom lighting effect. (Default = false)
; DisableBloom=false       ; Causes visual issues, excluded for now.

; [Experimental] Reduces weapon recoil when shooting. Adjustable with RecoilShakeAmplitudeScale. 
; RecoilShakeAmplitudeScale = 0.00 is maximum recoil reduction, 0.50 is 50% recoil reduction. 
; (Default = false / 0.00) 
ReduceWeaponRecoil=false     
RecoilShakeAmplitudeScale=0.00

; [Experimental] Reduces first person weapon recoil when shooting. Adjustable with FirstPersonRecoilShakeAmplitudeScale. 
; FirstPersonRecoilShakeAmplitudeScale = 0.00 is maximum recoil reduction, 0.50 is 50% recoil reduction. 
; (Default = false / 0.00)
ReduceFirstPersonWeaponRecoil=false
FirstPersonRecoilShakeAmplitudeScale=0.00

[Diagnostics]
DumpNativeHashes=false

